<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Chat — Invest Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    html, body { height: 100%; background: #020716; color: #f0f4fc; overflow: hidden; }

    .app { display: flex; height: 100vh; }

    /* Sidebar */
    .sidebar { width: 340px; border-right: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; background: rgba(6,15,34,0.95); flex-shrink: 0; }
    .sidebar-header { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 12px; }
    .sidebar-header .badge { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, #ffe167, #d29d15); color: #0d121c; display: grid; place-items: center; font-size: 18px; font-weight: 800; box-shadow: 0 0 14px rgba(229,184,47,0.35); }
    .sidebar-header h1 { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }
    .sidebar-header h1 span { color: #e5b82f; }
    .sidebar-header .admin-tag { font-size: 10px; color: #8899b5; margin-top: 2px; font-weight: 500; }

    .sessions-list { flex: 1; overflow-y: auto; }
    .sessions-list::-webkit-scrollbar { width: 4px; }
    .sessions-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .session-item { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 12px; }
    .session-item:hover { background: rgba(255,255,255,0.04); }
    .session-item.active { background: rgba(229,184,47,0.08); border-left: 3px solid #e5b82f; }
    .session-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg, #a11943, #16204c); display: grid; place-items: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
    .session-info { flex: 1; min-width: 0; }
    .session-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-preview { font-size: 11px; color: #6b7a94; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .session-meta { text-align: right; flex-shrink: 0; }
    .session-time { font-size: 10px; color: #5d6d87; }
    .session-unread { width: 18px; height: 18px; border-radius: 50%; background: #ef4444; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; margin-top: 4px; margin-left: auto; }

    .no-sessions { padding: 40px 20px; text-align: center; color: #5d6d87; font-size: 13px; }

    /* Chat area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #060e1f; }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; background: rgba(6,15,34,0.9); flex-shrink: 0; }
    .chat-header-info { display: flex; align-items: center; gap: 12px; }
    .chat-header-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(145deg, #a11943, #16204c); display: grid; place-items: center; font-size: 14px; font-weight: 700; }
    .chat-header-name { font-size: 14px; font-weight: 700; }
    .chat-header-email { font-size: 11px; color: #8899b5; margin-top: 1px; }
    .chat-header-actions button { padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #8899b5; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .chat-header-actions button:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #3d4f6b; gap: 10px; }
    .chat-empty-icon { font-size: 50px; opacity: 0.5; }
    .chat-empty p { font-size: 14px; }

    .msg { display: flex; flex-direction: column; max-width: 70%; }
    .msg-user { align-self: flex-start; }
    .msg-admin { align-self: flex-end; align-items: flex-end; }
    .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; }
    .msg-user .msg-bubble { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); color: #e4eaf5; border-bottom-left-radius: 5px; }
    .msg-admin .msg-bubble { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border-bottom-right-radius: 5px; }
    .msg-time { font-size: 10px; color: #5d6d87; margin-top: 3px; padding: 0 4px; }

    .chat-input-area { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.2); flex-shrink: 0; }
    .chat-input { flex: 1; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #f0f4fc; font-size: 13px; padding: 0 16px; outline: none; font-family: inherit; transition: border-color 0.2s; }
    .chat-input:focus { border-color: rgba(37,99,235,0.5); }
    .chat-input::placeholder { color: #3d4f6b; }
    .chat-send { height: 44px; padding: 0 20px; border-radius: 12px; border: none; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .chat-send:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    .chat-send:disabled { opacity: 0.35; cursor: not-allowed; }

    .notification-sound { display: none; }

    @media (max-width: 700px) {
      .sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; }
      .sidebar.hidden { display: none; }
      .chat-area.no-selection { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="badge">♔</div>
        <div>
          <h1>INVEST <span>BANK</span></h1>
          <div class="admin-tag">Admin Chat Dashboard</div>
        </div>
      </div>
      <div class="sessions-list" id="sessionsList">
        <div class="no-sessions" id="noSessions">No active conversations</div>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-empty" id="chatEmpty">
        <div class="chat-empty-icon">💬</div>
        <p>Select a conversation to start replying</p>
      </div>
      <div id="chatView" style="display:none; flex-direction:column; height:100%;">
        <div class="chat-header" id="chatHeader">
          <div class="chat-header-info">
            <div class="chat-header-avatar" id="chatAvatar">V</div>
            <div>
              <div class="chat-header-name" id="chatName">Visitor</div>
              <div class="chat-header-email" id="chatEmail">—</div>
            </div>
          </div>
          <div class="chat-header-actions">
            <button onclick="closeSession()">Close Session</button>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <form class="chat-input-area" id="chatForm" onsubmit="sendReply(event)">
          <input type="text" class="chat-input" id="chatInput" placeholder="Type your reply..." maxlength="1000" />
          <button type="submit" class="chat-send" id="chatSend">Send</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Notification sound -->
  <audio id="notifSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgip6markup" type="audio/wav">
  </audio>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // -- CONFIGURE: use your Supabase credentials --
    const SUPABASE_URL = 'https://wxuhzxtlwqxiubebeuhg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_-EpgENTvo2y1tCA2_4n_Yw_NcQEj2dO';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let sessions = [];
    let activeSessionId = null;
    let messages = [];
    let unreadCounts = {};

    // DOM refs
    const sessionsList = document.getElementById('sessionsList');
    const noSessions = document.getElementById('noSessions');
    const chatArea = document.getElementById('chatArea');
    const chatEmpty = document.getElementById('chatEmpty');
    const chatView = document.getElementById('chatView');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatName = document.getElementById('chatName');
    const chatEmail = document.getElementById('chatEmail');
    const chatAvatar = document.getElementById('chatAvatar');

    // Notification
    function playNotif() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    // Format time
    function fmtTime(dateStr) {
      const d = new Date(dateStr);
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      if (isToday) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Load sessions
    async function loadSessions() {
      const { data } = await supabase
        .from('chat_sessions')
        .select('*')
        .eq('status', 'active')
        .order('last_message_at', { ascending: false });

      if (data) {
        sessions = data;
        renderSessions();
      }
    }

    // Render sessions sidebar
    async function renderSessions() {
      if (sessions.length === 0) {
        noSessions.style.display = 'block';
        sessionsList.querySelectorAll('.session-item').forEach(el => el.remove());
        return;
      }
      noSessions.style.display = 'none';

      // Get last message for each session
      const previews = {};
      for (const s of sessions) {
        const { data } = await supabase
          .from('chat_messages')
          .select('content, sender, created_at')
          .eq('session_id', s.id)
          .order('created_at', { ascending: false })
          .limit(1);
        if (data && data[0]) previews[s.id] = data[0];
      }

      // Remove old items
      sessionsList.querySelectorAll('.session-item').forEach(el => el.remove());

      sessions.forEach(s => {
        const el = document.createElement('div');
        el.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
        const preview = previews[s.id];
        const previewText = preview ? (preview.sender === 'admin' ? 'You: ' : '') + preview.content : 'No messages yet';
        const initial = (s.user_name || 'V')[0].toUpperCase();
        const unread = unreadCounts[s.id] || 0;

        el.innerHTML = `
          <div class="session-avatar">${initial}</div>
          <div class="session-info">
            <div class="session-name">${s.user_name || 'Visitor'}</div>
            <div class="session-preview">${previewText}</div>
          </div>
          <div class="session-meta">
            <div class="session-time">${fmtTime(s.last_message_at || s.created_at)}</div>
            ${unread > 0 ? `<div class="session-unread">${unread}</div>` : ''}
          </div>
        `;
        el.addEventListener('click', () => selectSession(s.id));
        sessionsList.appendChild(el);
      });
    }

    // Select a session
    async function selectSession(id) {
      activeSessionId = id;
      unreadCounts[id] = 0;

      const session = sessions.find(s => s.id === id);
      if (session) {
        chatName.textContent = session.user_name || 'Visitor';
        chatEmail.textContent = session.user_email || '—';
        chatAvatar.textContent = (session.user_name || 'V')[0].toUpperCase();
      }

      chatEmpty.style.display = 'none';
      chatView.style.display = 'flex';

      await loadMessages(id);
      renderSessions();
      chatInput.focus();
    }

    // Load messages for a session
    async function loadMessages(sessionId) {
      const { data } = await supabase
        .from('chat_messages')
        .select('*')
        .eq('session_id', sessionId)
        .order('created_at', { ascending: true });

      messages = data || [];
      renderMessages();
    }

    // Render messages
    function renderMessages() {
      chatMessages.innerHTML = '';
      messages.forEach(m => {
        const el = document.createElement('div');
        el.className = `msg ${m.sender === 'admin' ? 'msg-admin' : 'msg-user'}`;
        el.innerHTML = `
          <div class="msg-bubble">${escapeHtml(m.content)}</div>
          <div class="msg-time">${m.sender === 'user' ? 'User · ' : 'You · '}${fmtTime(m.created_at)}</div>
        `;
        chatMessages.appendChild(el);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Send reply
    window.sendReply = async function(e) {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text || !activeSessionId) return;

      chatInput.value = '';

      const { error } = await supabase.from('chat_messages').insert({
        session_id: activeSessionId,
        sender: 'admin',
        content: text,
      });

      if (error) {
        console.error('Send failed:', error);
        chatInput.value = text;
        return;
      }

      await supabase
        .from('chat_sessions')
        .update({ last_message_at: new Date().toISOString() })
        .eq('id', activeSessionId);
    };

    // Close session
    window.closeSession = async function() {
      if (!activeSessionId) return;
      if (!confirm('Close this chat session?')) return;

      await supabase
        .from('chat_sessions')
        .update({ status: 'closed' })
        .eq('id', activeSessionId);

      sessions = sessions.filter(s => s.id !== activeSessionId);
      activeSessionId = null;
      chatView.style.display = 'none';
      chatEmpty.style.display = 'flex';
      renderSessions();
    };

    // Realtime: new sessions
    supabase
      .channel('admin-sessions')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_sessions' }, (payload) => {
        sessions.unshift(payload.new);
        renderSessions();
        playNotif();
        document.title = '🔴 New Chat — Admin';
        setTimeout(() => { document.title = 'Admin Chat — Invest Bank'; }, 5000);
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_sessions' }, (payload) => {
        const idx = sessions.findIndex(s => s.id === payload.new.id);
        if (idx >= 0) {
          if (payload.new.status === 'closed') {
            sessions.splice(idx, 1);
          } else {
            sessions[idx] = payload.new;
          }
          renderSessions();
        }
      })
      .subscribe();

    // Realtime: new messages
    supabase
      .channel('admin-messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
        const msg = payload.new;

        // Update session order
        const sIdx = sessions.findIndex(s => s.id === msg.session_id);
        if (sIdx > 0) {
          const [s] = sessions.splice(sIdx, 1);
          s.last_message_at = msg.created_at;
          sessions.unshift(s);
        }

        if (msg.session_id === activeSessionId) {
          // Add to current view if not already there
          if (!messages.some(m => m.id === msg.id)) {
            messages.push(msg);
            renderMessages();
          }
        } else if (msg.sender === 'user') {
          // Unread indicator
          unreadCounts[msg.session_id] = (unreadCounts[msg.session_id] || 0) + 1;
          playNotif();
          document.title = '🔴 New Message — Admin';
          setTimeout(() => { document.title = 'Admin Chat — Invest Bank'; }, 5000);
        }

        renderSessions();
      })
      .subscribe();

    // Initial load
    loadSessions();
  </script>
</body>
</html>
