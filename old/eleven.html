<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invest Bank Wallet</title>
  <style>
    :root {
      --bg: #020611;
      --panel: #07142f;
      --line: #193052;
      --muted: #8b9ab8;
      --text: #eef3ff;
      --gold: #e3a928;
      --blue: #4778ff
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 75% 30%, #150011 0, #030611 34%, #01040d 72%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -.01em
    }

    .browser {
      height: 57px;
      background: #202124;
      border-bottom: 1px solid #404247;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 19px;
      color: #aeb2bb
    }

    .browser .arrows {
      font-size: 27px;
      display: flex;
      gap: 18px
    }

    .browser .address {
      height: 34px;
      flex: 1;
      max-width: 875px;
      border-radius: 20px;
      background: #303134;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 14px;
      color: #e7e7e7
    }

    .lock {
      font-size: 13px;
      margin-right: 11px
    }

    .icons {
      margin-left: auto;
      display: flex;
      gap: 20px;
      font-size: 16px;
      align-items: center
    }

    .page {
      max-width: 440px;
      margin: 37px auto 80px;
      position: relative
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px
    }

    .welcome h1 {
      font-size: 29px;
      margin: 0 0 5px;
      font-weight: 800
    }

    .welcome p {
      margin: 0;
      color: #8493b1;
      font-size: 15px;
      overflow-wrap: anywhere;
      max-width: 270px
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 25px;
      color: #8290ad;
      font-size: 23px
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #bf8b20, #423318);
      color: #fff;
      font-weight: 700;
      font-size: 14px
    }

    .balance {
      height: 220px;
      border-radius: 24px;
      padding: 27px 28px;
      background: linear-gradient(145deg, #23091c, #241b13 65%, #10152a);
      border: 1px solid #4a2633;
      box-shadow: 0 10px 30px #0008;
      margin-bottom: 20px
    }

    .balance small {
      color: #a68ea0;
      font-size: 14px
    }

    .amount {
      font-size: 36px;
      font-weight: 800;
      margin: 12px 0 8px
    }

    .gain {
      color: #bf942a;
      font-size: 14px
    }

    .cards {
      display: grid;
      gap: 20px
    }

    .card {
      border: 1px solid #0e1b34;
      background: #060d1eaa;
      border-radius: 24px;
      padding: 21px 20px;
      min-height: 120px
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 18px
    }

    .card p {
      margin: 0;
      color: #71829f;
      font-size: 14px
    }

    .transaction {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .transaction .left {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .gift {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #221c12;
      color: #b18a29;
      display: grid;
      place-items: center;
      font-size: 17px
    }

    .right {
      text-align: right
    }

    .right strong {
      color: #b2861d;
      font-size: 17px;
      display: block
    }

    .right span {
      font-size: 13px;
      color: #64748e
    }

    .support {
      min-height: 118px
    }

    .support h3 {
      color: #c4cde0
    }

    .support h3:before {
      content: '✉ ';
      font-size: 18px
    }

    .support p {
      line-height: 1.6
    }

    .chat {
      position: fixed;
      left: 16px;
      bottom: 98px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 27px;
      color: white;
      background: linear-gradient(145deg, #721b44, #142252);
      border: 1px solid #af6b64;
      box-shadow: 0 0 20px #4b193d88
    }

    .chat:after {
      content: '';
      width: 18px;
      height: 15px;
      border: 2px solid white;
      border-radius: 50%;
      position: absolute
    }

    .chat:before {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      border-left: 2px solid white;
      transform: translate(-5px, 8px) rotate(-30deg)
    }

    .shade {
      position: fixed;
      inset: 57px 0 0;
      background: rgba(0, 0, 0, .55)
    }

    .modal {
      position: fixed;
      z-index: 2;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -43%);
      width: 448px;
      border-radius: 25px;
      background: #081531;
      padding: 26px 24px 24px;
      text-align: center;
      box-shadow: 0 18px 50px #0009
    }

    .phone {
      margin: 0 auto 18px;
      width: 57px;
      height: 57px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #102d68;
      color: #3965c9;
      font-size: 28px
    }

    .modal h2 {
      margin: 0 0 10px;
      font-size: 20px
    }

    .modal .sub {
      margin: 0 0 22px;
      color: #a5b0c6;
      font-size: 15px
    }

    .modal label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px
    }

    .modal input {
      width: 100%;
      height: 43px;
      border-radius: 17px;
      border: 1px solid #203457;
      background: transparent;
      color: #fff;
      padding: 0 13px;
      font-size: 14px;
      outline: none
    }

    .modal input:focus {
      border-color: #496dd4
    }

    .modal button {
      width: 100%;
      height: 46px;
      margin-top: 20px;
      border-radius: 16px;
      border: 1px solid #b14253;
      background: linear-gradient(180deg, #a51e3e, #412049 58%, #112a62);
      color: white;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer
    }

    .modal button:hover {
      filter: brightness(1.15)
    }

    @media(max-width:600px) {
      .browser {
        height: 48px
      }

      .browser .address {
        font-size: 11px
      }

      .icons {
        display: none
      }

      .page {
        margin: 28px 20px 70px
      }

      .modal {
        width: calc(100% - 32px);
        top: 50%;
      }

      .shade {
        inset: 48px 0 0
      }

      .welcome h1 {
        font-size: 25px
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <header class="top">
      <div class="welcome">
        <h1>Welcome back</h1>
        <p>tredduquomm̄aje-4676@yopmail.com</p>
      </div>
      <div class="actions"><span>♧</span><span>⇥</span>
        <div class="avatar">Si</div>
      </div>
    </header>
    <section class="balance"><small>Total balance</small>
      <div class="amount">$25,000.00</div>
      <div class="gain">+$2,500.00 (10.00%)</div>
    </section>
    <section class="cards">
      <article class="card transaction">
        <div class="left">
          <div class="gift">♔</div>
          <div>
            <h3>Invest Bank</h3>
            <p>Sep 11, 12:46 AM</p>
          </div>
        </div>
        <div class="right"><strong>+$10,000.00</strong><span>Bonus</span></div>
      </article>
      <article class="card support">
        <h3>Support</h3>
        <p>Need help? Contact us:<br>support@smartinvest.com</p>
      </article>
    </section>
  </main>
  <div class="chat"></div>
  <div class="shade"></div>
  <section class="modal" role="dialog" aria-modal="true">
    <div class="phone">⌕</div>
    <h2>Add your phone number</h2>
    <p class="sub">We need a phone number on file to secure your account.</p>
    <form
      onsubmit="event.preventDefault(); alert('Phone number saved'); setTimeout(() => { window.location.href='twelve.html'; }, 300);">
      <label for="phone">Phone number</label><input id="phone" type="tel" placeholder="+1 555 123 4567" required><button
        type="submit">Save &amp; Continue</button></form>
  </section>
  <script>
    const savedEmail = localStorage.getItem('userEmail');
    if (savedEmail) {
      const emailEl = document.querySelector('.welcome p');
      if (emailEl) emailEl.textContent = savedEmail;
    }
  </script>
</body>

</html>
